name: Portfolio integrity guard

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect candidate source
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Inspect exact Git objects without executing candidate code
        env:
          READ_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, json, os, re, sys, urllib.request
          from pathlib import PurePosixPath

          def oid(value):
              if not re.fullmatch(r"[a-f0-9]{40}", value or ""):
                  raise ValueError("Invalid Git commit or blob ID")
              return value

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def api(suffix):
              url = "https://api.github.com/repos/" + repo + "/" + suffix
              req = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + os.environ["READ_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "portfolio-integrity-guard",
              })
              with urllib.request.build_opener(NoRedirect).open(req, timeout=20) as response:
                  payload = response.read(10_000_001)
              if len(payload) > 10_000_000:
                  raise ValueError("GitHub response too large")
              return json.loads(payload)

          def check(path, raw):
              flags = set()
              name = PurePosixPath(path).name.lower()
              if name in {"branch_structure.json", "temp_auto_push.bat"}:
                  flags.add("known suspicious artifact name")
              if b"\x00" in raw:
                  return flags
              s = raw.decode("utf-8", errors="replace").lstrip("\ufeff")
              if re.search(r"\t{12,}\S|\S[ \t]{40,}\S", s):
                  flags.add("unusual whitespace conceals text")
              if re.search(r"[\u061c\u200b\u200e\u200f\u202a-\u202e\u2060\u2066-\u2069\ufeff]", s):
                  flags.add("invisible or directional characters")
              if name == "package.json" and re.search(r"\bnode\s+(?:\./)?api\.js\s*&&", s):
                  flags.add("unexpected install/build hook pattern")
              if path.lower().endswith(".vscode/tasks.json") and re.search(r'"runOn"\s*:\s*"folderOpen"', s):
                  flags.add("automatic folder-open task")
              if re.search(r"\.(?:woff2?|ttf|otf|eot)$", path, re.I) and re.search(r"\b(?:require\s*\(|function\s*(?:[A-Za-z_$][A-Za-z0-9_$]*\s*)?\(|import\s)", s[:8192]):
                  flags.add("script-like content in font-named file")
              return flags

          def run():
              event_name = os.environ["GITHUB_EVENT_NAME"]
              with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as f:
                  event = json.load(f)
              if event_name == "pull_request":
                  pr = event["pull_request"]
                  before, after = oid(pr["base"]["sha"]), oid(pr["head"]["sha"])
              elif event_name == "push":
                  before, after = oid(event["before"]), oid(event["after"])
                  if event.get("forced") or before == "0" * 40:
                      raise ValueError("Forced update or unanchored branch; review required")
              else:
                  raise ValueError("Unsupported event")
              data = api("compare/" + before + "..." + after)
              if event_name == "push" and data.get("status") not in {"ahead", "identical"}:
                  raise ValueError("Main does not descend from the preceding commit")
              files = data.get("files")
              if not isinstance(files, list) or len(files) >= 300:
                  raise ValueError("Compare output unavailable or hits the GitHub cap")
              if event_name == "pull_request" and isinstance(pr.get("changed_files"), int) and len(files) != pr["changed_files"]:
                  raise ValueError("File list disagrees with the pull request")
              issues = []
              for f in files:
                  path = f["filename"]
                  if f.get("status") == "removed":
                      continue
                  if re.search(r"(^|/)(?:\.github/|\.vscode/|\.devcontainer/|wrangler\.|package(?:-lock)?\.json$|.*(?:deploy|release)[^/]*\.(?:yaml|yml|sh|py)$)", path, re.I):
                      print("REVIEW RELEASE CONTROL", ascii(path))
                  if re.search(r"\.(?:png|jpe?g|webp|gif|ico|pdf|mp[34]|zip|avif)$", path, re.I):
                      print("ARTIFACT OUTSIDE TEXT SCAN", ascii(path))
                      continue
                  blob = api("git/blobs/" + oid(f.get("sha")))
                  if blob.get("size", 10_000_000) > 5_000_000 or blob.get("encoding") != "base64":
                      raise ValueError("Changed blob needs a separate review")
                  raw = base64.b64decode("".join(blob["content"].split()), validate=True)
                  if len(raw) != blob["size"]:
                      raise ValueError("Blob size mismatch")
                  for reason in sorted(check(path, raw)):
                      issues.append((path, reason))
              for path, reason in issues:
                  print("FLAG", ascii(path), reason, file=sys.stderr)
              print(f"Candidate {after}: {len(files)} changed path(s), {len(issues)} signal(s)")
              return 1 if issues else 0

          repo = os.environ["GITHUB_REPOSITORY"]
          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo):
              sys.exit("Invalid repository identifier")
          try:
              sys.exit(run())
          except (ValueError, KeyError, OSError) as e:
              print("Scan did not complete:", type(e).__name__, file=sys.stderr)
              sys.exit(1)
          PY
